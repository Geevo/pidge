name: Release

# Pushing a tag such as v0.1.0 or v0.1.0-pre.12 builds everything on clean
# runners and opens a draft release with the files and their checksums. Nothing
# is public until the draft is published by hand.
#
# Run it from the Actions tab instead to build without releasing: the files are
# kept as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux
    # The oldest supported Ubuntu, so the executable runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install native toolchain, webview and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            rpm squashfs-tools

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(dotnet msbuild src/Pidge.Desktop -getProperty:Version)
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"; exit 1 ;;
          esac

      - name: Build
        run: pnpm build:desktop --rid linux-x64

      # The executable is the whole app, with the window host inside it. GTK
      # and WebKitGTK come from the system; see docs/packaging.md.
      - name: Package
        run: |
          version=$(dotnet msbuild src/Pidge.Desktop -getProperty:Version)
          bash scripts/package-linux.sh "$version" artifacts/desktop/linux-x64/pidge out

      # The extension, with this platform's sidecar inside.
      - name: VS Code extension
        shell: bash
        run: |
          version=$(dotnet msbuild src/Pidge.Desktop -getProperty:Version)
          pnpm build:sidecar
          pnpm --filter pidge build
          cd apps/vscode
          pnpm exec vsce package --no-dependencies --target linux-x64 -o "../../out/pidge-vscode-$version-linux-x64.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:desktop --rid win-x64

      # The executable is the whole app, with the window host and the WebView2
      # loader inside it; the zip adds the licences.
      - name: Collect
        shell: pwsh
        run: |
          $version = dotnet msbuild src/Pidge.Desktop -getProperty:Version
          New-Item -ItemType Directory out, zip | Out-Null
          Copy-Item artifacts/desktop/win-x64/pidge.exe, `
            LICENSE, THIRD-PARTY-LICENSES.md, `
            packages/ui/src/fonts/IBMPlexSans-LICENSE.txt, `
            packages/ui/src/fonts/IBMPlexMono-LICENSE.txt zip/
          Compress-Archive zip/* "out/pidge-$version-windows-x64.zip"
          Get-ChildItem out

      # The extension, with this platform's sidecar inside.
      - name: VS Code extension
        shell: bash
        run: |
          version=$(dotnet msbuild src/Pidge.Desktop -getProperty:Version)
          pnpm build:sidecar
          pnpm --filter pidge build
          cd apps/vscode
          pnpm exec vsce package --no-dependencies --target win32-x64 -o "../../out/pidge-vscode-$version-win32-x64.vsix"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Proof that these files were built here, from this tag, by this
      # workflow; checked with `gh attestation verify`. GitHub only offers it
      # for public repositories on this plan.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: out/SHA256SUMS

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" out/* --draft $prerelease \
            --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA."
