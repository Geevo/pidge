<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0.05" y1="1" x2="0.95" y2="0">
      <stop offset="0" stop-color="#0a0c11" />
      <stop offset="0.55" stop-color="#10141c" />
      <stop offset="1" stop-color="#1e3d72" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#5eabff" />
      <stop offset="1" stop-color="#2b80ff" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="236" ry="236" fill="url(#tile)" />

  <!-- Out and back: the two chevrons. -->
  <g
    fill="none"
    stroke="url(#mark)"
    stroke-width="88"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M382 322 L152 512 L382 702" />
    <path d="M642 322 L872 512 L642 702" />
  </g>

  <!-- The request itself, between them. The stroke rounds the corners of the
       fill rather than outlining it, so both are the same paint. -->
  <path
    d="M366 481 H540 V450 L648 512 L540 574 V543 H366 Z"
    fill="url(#mark)"
    stroke="url(#mark)"
    stroke-width="26"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
