[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/http-engine",
    "crates/storage",
    "crates/variables",
    "crates/protocol",
    "crates/session",
    "crates/sidecar",
    "crates/testserver",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/lukegeeves/api-client"

[workspace.dependencies]
api-client-core = { path = "crates/core" }
api-client-http-engine = { path = "crates/http-engine" }
api-client-storage = { path = "crates/storage" }
api-client-variables = { path = "crates/variables" }
api-client-protocol = { path = "crates/protocol" }
api-client-session = { path = "crates/session" }
api-client-testserver = { path = "crates/testserver" }

base64 = "0.23"
digest_auth = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
    "charset",
    "cookies",
    "default-tls",
    "deflate",
    "form",
    "gzip",
    "http2",
    "multipart",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "net", "time", "sync"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.18"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
