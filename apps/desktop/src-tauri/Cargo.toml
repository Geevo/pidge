[package]
name = "api-client-desktop"
description = "pidge: a small HTTP client for your own machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "api_client_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pidge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
api-client-core.workspace = true
api-client-session.workspace = true
api-client-storage.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
