[package]
name = "api-client-testserver"
description = "Minimal local HTTP server used by the engine tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
md-5 = "0.10"
p12-keystore = "0.3"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
