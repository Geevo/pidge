[package]
name = "api-client-sidecar"
description = "Long-running request engine driven over stdin/stdout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "api-client-sidecar"
path = "src/main.rs"

[dependencies]
api-client-codegen.workspace = true
api-client-core.workspace = true
api-client-protocol.workspace = true
api-client-session.workspace = true
api-client-storage.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
api-client-testserver.workspace = true
tempfile = "3"
